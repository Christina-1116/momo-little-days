<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#2e1d18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="MOMO · 毛毛的小日子 —— 温暖复古风的毛绒小兔养成小游戏：养成、闯关、装扮、小窝、回忆相册。">
  <title>MOMO · 毛毛的小日子</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&family=ZCOOL+KuaiLe&family=Caveat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="showcase">
    <div class="sc-logo">MO<span>MO</span></div>
    <h2>毛毛的小日子</h2>
    <p>一只毛绒绒的小兔子住进了你的手机。<br>喂它吃饭、陪它洗澡、哄它睡觉，<br>带它去草地、森林和星光池塘冒险，<br>把每一个小时光都收进相册里。</p>
    <div class="sc-feat">
      <div><b>养成</b><small>拖动喂食 · 搓泡泡澡</small></div>
      <div><b>闯关</b><small>3 个区域 · 9 个关卡</small></div>
      <div><b>装扮</b><small>17 件衣橱单品</small></div>
      <div><b>小窝</b><small>可互动的家具摆设</small></div>
      <div><b>相册</b><small>12 个回忆 + 随手拍</small></div>
      <div><b>每日</b><small>任务 · 宝箱 · 小礼物</small></div>
    </div>
    <div class="sc-hint">提示：用鼠标搓一搓毛毛试试 ♡　进度自动保存在本机</div>
  </aside>

  <main class="phone" id="phone">
    <div class="statusbar">
      <span id="sbTime">9:41</span>
      <span class="sb-r">
        <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.3-1.3C13.5 1.4 10.9.3 8 .3S2.5 1.4.5 3.4l1.3 1.3C3.4 3.1 5.6 2.2 8 2.2zm0 3.7c1.4 0 2.7.5 3.6 1.4l1.3-1.3C11.6 4.7 9.9 4 8 4s-3.6.7-4.9 2l1.3 1.3c.9-.9 2.2-1.4 3.6-1.4zM8 9.6l2.1-2.1C9.5 7 8.8 6.7 8 6.7s-1.5.3-2.1.8L8 9.6z"/></svg>
        <svg viewBox="0 0 27 12"><rect x=".5" y=".5" width="23" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="20" height="8" rx="1.8" fill="currentColor"/><path d="M25 4v4c.8-.3 1.3-1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".5"/></svg>
      </span>
    </div>

    <div class="screens">
      <section class="screen" id="s-home"></section>
      <section class="screen" id="s-tasks"></section>
      <section class="screen" id="s-adventure"></section>
      <section class="screen" id="s-room"></section>
      <section class="screen" id="s-album"></section>
      <section class="screen" id="s-wardrobe"></section>
    </div>

    <nav class="tabbar" id="tabbar"></nav>
    <div class="game" id="game"></div>
    <div id="sheet-root"></div>
    <div id="modal-root"></div>
    <div id="fx"></div>
    <div class="toast-root" id="toasts"></div>
    <div class="home-ind"></div>
  </main>

  <script src="js/art.js"></script>
  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
